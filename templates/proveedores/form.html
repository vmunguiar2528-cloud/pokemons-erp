{% extends 'base.html' %}

{% block title %}{{ titulo }} — ERP{% endblock %}

{% block extra_css %}
<style>
    .card { background: white; max-width: 550px; margin: 2rem auto; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.08); }
    .card h2 { margin-bottom: 1.5rem; color: #0A2342; }
    form p { margin-bottom: 1rem; }
    label { display: block; margin-bottom: 0.4rem; font-weight: bold; }
    input, textarea { width: 100%; padding: 0.6rem; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    .btn { background: #0A2342; color: white; padding: 0.75rem; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-size: 1rem; font-weight: bold; margin-top: 1rem; }
    .btn:hover { background: #133863; }
</style>
{% endblock %}

{% block content %}
<div class="card">
    <h2>{{ titulo }}</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Guardar Proveedor</button>
    </form>
</div>
{% endblock %}

{% extends 'base.html' %}

{% block title %}{{ titulo }} — ERP{% endblock %}

{% block extra_css %}
<style>
    .card { background: white; max-width: 600px; margin: 2rem auto; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 14px rgba(0,0,0,0.08); }
    .card h2 { margin-bottom: 1.5rem; color: #0A2342; }
    form p { margin-bottom: 1rem; }
    label { display: block; margin-bottom: 0.4rem; font-weight: bold; color: #0A2342; }
    input, select, textarea { width: 100%; padding: 0.75rem; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; }
    .btn { background: #0A2342; color: white; padding: 0.8rem 1rem; border: none; border-radius: 8px; cursor: pointer; width: 100%; font-size: 1rem; font-weight: bold; margin-top: 1rem; }
    .btn:hover { background: #133863; }
    .image-preview { margin-top: 1rem; max-width: 100%; border-radius: 10px; border: 1px solid #ddd; display: none; }
</style>
{% endblock %}

{% block content %}
<div class="card">
    <h2>{{ titulo }}</h2>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        {% if form.instance.imagen %}
            <img src="{{ form.instance.imagen.url }}" class="image-preview" style="display:block;" alt="Imagen del producto">
        {% endif %}
        <button type="submit" class="btn">Guardar Producto</button>
    </form>
</div>
{% endblock %}
